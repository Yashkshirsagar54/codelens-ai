  <!-- Open Graph / Facebook / LinkedIn -->

  <meta name="twitter:image" content="https://codelens.ai/og-image.png" />

  <!-- Anti-FOUC Blocking Theme Script: Default to Dark Obsidian Theme -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('codelens_theme');
        var isDark = stored ? stored === 'dark' : true;
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.add('dark');
          localStorage.setItem('codelens_theme', 'dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- Google Fonts: Inter, JetBrains Mono, Plus Jakarta Sans, Instrument Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Great+Vibes&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;0,900;1,400&display=swap"
